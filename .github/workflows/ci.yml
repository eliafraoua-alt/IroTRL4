name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Lint & Types ──────────────────────────────────────────────────────────
  lint:
    name: TypeScript & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer dépendances
        run: npm ci --frozen-lockfile

      - name: TypeScript — vérification types
        run: npm run lint

      - name: Audit sécurité npm
        run: npm audit --audit-level=high

  # ── 2. Tests + Coverage Gate ─────────────────────────────────────────────────
  # Le gate est délégué aux thresholds natifs de vitest.config.ts (perFile activé).
  # Plus de node -e require() qui cassait en ESM ("type":"module" dans package.json).
  test:
    name: Tests & Coverage (≥60%)
    runs-on: ubuntu-latest
    needs: lint
    env:
      # CORRECTION : seul Gemini est injecté.
      # ANTHROPIC et MISTRAL retirées du job test — tous leurs appels sont mockés via vi.mock.
      # Les injecter avec des valeurs mock peut masquer des appels réseau réels non-mockés.
      GEMINI_API_KEY: test-gemini-mock
      NODE_ENV:       test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer dépendances
        run: npm ci --frozen-lockfile

      - name: Suite adversariale — Correctif C2
        run: npx vitest run tests/adversarial-injection.vitest.test.ts

      - name: Tests Vitest + coverage
        # Les thresholds (global 60%, iro-engine 80%, llm-router 70%) sont définis
        # dans vitest.config.ts. Vitest exit(1) automatiquement si non atteints.
        run: npm run test:coverage -- --reporter=verbose --reporter=json

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  # ── 3. Tests contractuels LLM ────────────────────────────────────────────────
  llm-contracts:
    name: Tests contractuels LLM Router
    runs-on: ubuntu-latest
    needs: lint
    env:
      GEMINI_API_KEY:    test-mock
      ANTHROPIC_API_KEY: test-mock
      MISTRAL_API_KEY:   test-mock

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --frozen-lockfile
      - name: Tests router + metrics
        run: npx vitest run tests/llm-router.vitest.test.ts tests/founder-enrichment.vitest.test.ts tests/honesty-gate.vitest.test.ts --reporter=verbose # prompt-regression and honesty gate

  # ── Recalibrate ─────────────────────────────────────────────────────────────
  recalibrate:
    name: Recalibration automatique des bêtas (Cox)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer dépendances
        run: npm ci --frozen-lockfile

      - name: Exécuter la calibration & générer le nouveau fichier JSON
        run: npx tsx scripts/calibrate-cox.ts

      - name: Vérifier s'il y a des changements de bêtas calibrés
        id: check_changes
        run: |
          git diff --quiet src/config/cox-betas-calibrated.json src/config/calibration-plot.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit et Push des bêtas versionnés (si modifiés)
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "Github Bot [Calibration Engine]"
          git config --global user.email "bot@irostrength.ai"
          git add src/config/cox-betas-calibrated.json src/config/calibration-plot.json
          git commit -m "Auto-calibration: mise à jour automatique des bêtas et courbes [Skip CI]"
          git push

  # ── 4. Python batch ──────────────────────────────────────────────────────────
  python:
    name: Python batch — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Syntaxe batch_gemini_iro.py
        run: python -m py_compile batch_gemini_iro.py && echo "OK"
      - name: Syntaxe pipeline_donnees_reelles.py
        run: python -m py_compile pipeline_donnees_reelles.py && echo "OK"
      - name: Imports critiques
        run: |
          python -c "
          import google.generativeai, dotenv, numpy, pandas, lifelines
          print('Imports OK')
          "

  # ── 5. Docker Build ──────────────────────────────────────────────────────────
  # Dépend de test, llm-contracts et recalibrate — les trois doivent passer avant le push image.
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, llm-contracts, recalibrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/irostrength
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=v7.0.0
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_VERSION=7.0.0

      - name: Résumé
        run: |
          echo "## Docker ✅" >> $GITHUB_STEP_SUMMARY
          echo "Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  # ── 6. Continuous Deployment (CD) ──────────────────────────────────────────
  deploy:
    name: Deployment en Continu (CD)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Authentification Cloud Provider
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Déployer l'image sur Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: irostrength-v7
          image: ghcr.io/${{ github.repository_owner }}/irostrength:latest
          region: europe-west1
          flags: '--allow-unauthenticated'
          env_vars: |
            NODE_ENV=production
            PORT=3000
          # CORRECTION SEC : clés injectées via Secret Manager GCP (jamais en clair dans env_vars).
          # Créer dans GCP Secret Manager : GEMINI_API_KEY, PAPPERS_API_KEY, MISTRAL_API_KEY
          # Accorder roles/secretmanager.secretAccessor au compte de service GCP.
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            PAPPERS_API_KEY=PAPPERS_API_KEY:latest
            MISTRAL_API_KEY=MISTRAL_API_KEY:latest
